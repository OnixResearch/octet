# r[impl octet.valence_project_extraction.phase5.flake_check_ci]
name: Nix flake check

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch. A newer push to a branch, or the pull request opened from
# it, cancels the older run, so a pull request commit is not checked twice.
# Branch pushes without a pull request, release branches and tags still run.
# Fork pull requests get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Expected-green subset (`checks.<system>.core` in flake.nix). The full flake
  # check below also runs rails that wait on owner review, so only this job
  # distinguishes a regression from known-blocked evidence.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Substitute unchanged derivations from the onixresearch Cachix cache.
      # A run writes to it only when its author can already write to this
      # repository: `push` events, and `pull_request` events whose head
      # repository is this repository. Same-repository pull request authors
      # already have write access, and every push to their branch writes to
      # this cache, so this admits no new writer. Fork pull requests never
      # receive the token, and their checkout stays read-only. Without the
      # secret, pushing stays disabled for every run.
      - uses: cachix/cachix-action@v17
        with:
          name: onixresearch
          authToken: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - run: nix build .#checks.x86_64-linux.core --print-build-logs

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          # Same writer rule as the `core` job: push events and same-repository
          # pull requests write; fork pull requests only read and never get the
          # secret.
          name: onixresearch
          authToken: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - name: Admit pinned Bubblewrap user namespaces
        # Ubuntu restricts unprofiled user namespaces. Admit only the locked
        # Nix executable; keep the global restriction and network denial intact.
        run: |
          bwrap="$(nix shell --inputs-from . nixpkgs#bubblewrap --command sh -c 'command -v bwrap')"
          case "$bwrap" in
            /nix/store/*-bubblewrap-*/bin/bwrap) ;;
            *) printf 'Unexpected Bubblewrap path: %s\n' "$bwrap" >&2; exit 1 ;;
          esac
          profile="$RUNNER_TEMP/octet-nix-bwrap.apparmor"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile octet-nix-bwrap "%s" flags=(unconfined) {\n  userns,\n}\n' "$bwrap" > "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/octet-nix-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/octet-nix-bwrap
          "$bwrap" --unshare-user --unshare-net --unshare-pid \
            --die-with-parent --new-session --ro-bind / / \
            --proc /proc --dev /dev /bin/true
      - name: Build cold Lean gates without competing derivations
        # Their reviewed deadlines include compiling the selected Mathlib closure.
        # Reserve the runner CPUs rather than weakening producer timeouts.
        run: >-
          nix build .#checks.x86_64-linux.mantle-aeneas-consumer-job
          .#checks.x86_64-linux.aeneas-lean-compatibility-matrix
          --no-link --max-jobs 1 --cores 0 --print-build-logs
      - run: nix flake check --print-build-logs

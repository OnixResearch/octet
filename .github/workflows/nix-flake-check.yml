# r[impl octet.valence_project_extraction.phase5.flake_check_ci]
name: Nix flake check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Expected-green subset (`checks.<system>.core` in flake.nix). The full flake
  # check below also runs rails that wait on owner review, so only this job
  # distinguishes a regression from known-blocked evidence.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix build .#checks.x86_64-linux.core --print-build-logs

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix flake check

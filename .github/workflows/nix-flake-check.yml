# r[impl octet.valence_project_extraction.phase5.flake_check_ci]
name: Nix flake check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Expected-green subset (`checks.<system>.core` in flake.nix). The full flake
  # check below also runs rails that wait on owner review, so only this job
  # distinguishes a regression from known-blocked evidence.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix build .#checks.x86_64-linux.core --print-build-logs

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Admit pinned Bubblewrap user namespaces
        # Ubuntu restricts unprofiled user namespaces. Admit only the locked
        # Nix executable; keep the global restriction and network denial intact.
        run: |
          bwrap="$(nix shell --inputs-from . nixpkgs#bubblewrap --command sh -c 'command -v bwrap')"
          case "$bwrap" in
            /nix/store/*-bubblewrap-*/bin/bwrap) ;;
            *) printf 'Unexpected Bubblewrap path: %s\n' "$bwrap" >&2; exit 1 ;;
          esac
          profile="$RUNNER_TEMP/octet-nix-bwrap.apparmor"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile octet-nix-bwrap "%s" flags=(unconfined) {\n  userns,\n}\n' "$bwrap" > "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/octet-nix-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/octet-nix-bwrap
          "$bwrap" --unshare-user --unshare-net --unshare-pid \
            --die-with-parent --new-session --ro-bind / / \
            --proc /proc --dev /dev /bin/true
      - name: Build cold Lean producer without competing derivations
        # Its reviewed deadline includes compiling the selected Mathlib closure.
        # Reserve the runner CPUs rather than weakening the producer timeout.
        run: >-
          nix build .#checks.x86_64-linux.mantle-aeneas-consumer-job
          --no-link --max-jobs 1 --cores 0 --print-build-logs
      - run: nix flake check --print-build-logs

# Copyable consumer CI step for the Octet checked path; this is not a claim
# that every lint is denied. Set reviewed lint policy in dylint.toml.
# Candidate instructions: use only after v0.1.1-rc.1 is qualified and published.
# Requirements: Nix on x86_64-linux, checked-in consumer Cargo.lock,
# templates/dylint.toml copied to dylint.toml, and [workspace.metadata.octet]
# configured in the consumer workspace Cargo.toml. Nightly Rust/Dylint are
# supplied by the pinned source-only flake; no Cargo installation is required.
#
# CI must always run this gate; Octet has no flag or environment variable that
# skips it.

steps:
  - name: Octet checked path
    run: |
      nix run github:OnixResearch/octet/v0.1.1-rc.1#cargo-octet -- check \
        --output-format sarif \
        --artifact-dir artifacts/octet
      nix run github:OnixResearch/octet/v0.1.1-rc.1#cargo-octet -- artifact verify \
        --artifact-dir artifacts/octet

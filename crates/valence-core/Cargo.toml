[package]
name = "valence-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Pure Valence evidence core extracted from Octet CLI surfaces"
readme = "README.md"
repository = "https://github.com/onixresearch/octet"
homepage = "https://github.com/onixresearch/octet"
documentation = "https://github.com/onixresearch/octet/tree/main/crates/valence-core"
keywords = ["valence", "evidence", "octet", "blake3"]
categories = ["development-tools"]

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

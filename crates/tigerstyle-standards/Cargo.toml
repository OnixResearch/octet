[package]
name = "tigerstyle-standards"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Policy registry and standards checks for tigerstyle"

[lib]
name = "tigerstyle_standards"
path = "src/lib.rs"

[[bin]]
name = "tigerstyle-standards"
path = "src/main.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3"

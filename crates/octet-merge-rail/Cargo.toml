[package]
name = "octet-merge-rail"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Bounded four-version semantic merge relation prototype for Octet"
repository = "https://github.com/OnixResearch/octet"
homepage = "https://octet.dev"
readme = "../../README.md"

[lib]
name = "octet_merge_rail"
path = "src/lib.rs"

[[bin]]
name = "octet-merge-rail-experiment"
path = "src/bin/merge-rail-experiment.rs"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }

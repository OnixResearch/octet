schema: spec-driven

project:
  name: tigerstyle
  description: Custom Clippy lints and agent-facing guidance enforcing Tiger Style coding principles
  language: rust

domains:
  - safety
  - naming
  - structure
  - purity
  - concurrency
  - performance
  - documentation

context: |
  Rust lint crate using dylint or cargo-marker.
  Lints enforce Tiger Style rules derived from TigerBeetle's coding philosophy.
  Primary consumer is the aspen distributed systems project.
  Lints target production code — test code gets exemptions where noted.
  We use nix flakes for builds, nextest for testing.
  The repo also maintains the Tiger Style agent skill under ~/.pi/agent/skills/tigerstyle/.

rules:
  proposal:
    - Keep it under 500 words
    - Reference concrete violations found in aspen
  tasks:
    - Changes must cover every MUST added by their delta specs
    - Follow `openspec/templates/tasks.md` for `I<n>`, `V<n>`, and `H<n>` task IDs, the exact `## Change Status` section, and the trailing `## Verification Coverage` section
    - Keep implementation, deterministic verification, and human/oracle checkpoints in separate checkbox units; an `I<n>` task becomes invalid if it includes markers like `verify`, `save`, `capture`, `evidence=`, or a repo-relative `evidence/` path
    - Compare `tasks.md` against the delta-spec scenario headings and keep one `## Verification Coverage` row per added or modified scenario, even when multiple rows share one artifact
    - Keep `## Change Status` immediately before `## Verification Coverage`; use either `- Status: in-progress` plus unchecked governed `I<n>`, `V<n>`, and `H<n>` IDs in file order, or `- Status: complete` plus `- Open tasks: none`
    - Block these exact change-status findings when they apply: `tasks.md is missing ## Change Status`, `Change status section is malformed or misplaced`, `Change status says complete but unchecked tasks remain`, `Change status says in-progress but no open tasks remain`, `Change status open-task list does not match unchecked tasks`
    - `H<n>` tasks are invalid unless they include `command=`, `input=`, `asserts=`, and `evidence=`
    - Keep a reference-to-skill crosswalk for skill-coverage changes
    - Record validation evidence before marking the change complete

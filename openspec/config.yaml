schema: spec-driven

project:
  name: tigerstyle
  description: Custom Clippy lints and agent-facing guidance enforcing Tiger Style coding principles
  language: rust

domains:
  - safety
  - naming
  - structure
  - purity
  - concurrency
  - performance
  - documentation

context: |
  Rust lint crate using dylint or cargo-marker.
  Lints enforce Tiger Style rules derived from TigerBeetle's coding philosophy.
  Primary consumer is the aspen distributed systems project.
  Lints target production code — test code gets exemptions where noted.
  We use nix flakes for builds, nextest for testing.
  The repo also maintains the Tiger Style agent skill under ~/.pi/agent/skills/tigerstyle/.

rules:
  proposal:
    - Keep it under 500 words
    - Reference concrete violations found in aspen
  tasks:
    - Changes must cover every MUST added by their delta specs
    - Keep a reference-to-skill crosswalk for skill-coverage changes
    - Record validation evidence before marking the change complete

[package]
name = "cargo-tigerstyle"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "First-class downstream consumer integration for tigerstyle"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[build-dependencies]
blake3 = "1"

[dev-dependencies]
tempfile = "3"

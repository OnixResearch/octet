[package]
name = "cargo-octet"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "First-class downstream consumer integration for Octet"

[[bin]]
name = "cargo-octet"
path = "src/main.rs"

[[bin]]
name = "cargo-slotcar"
path = "src/bin/cargo-slotcar.rs"

[[bin]]
name = "cargo-tigerstyle"
path = "src/bin/cargo-tigerstyle.rs"

[dependencies]
octet-standards = { path = "../crates/octet-standards" }
valence-core = { path = "../crates/valence-core" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[build-dependencies]
blake3 = "1"

[dev-dependencies]
tempfile = "3"

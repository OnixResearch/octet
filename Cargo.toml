[package]
name = "tigerstyle"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Custom lints enforcing Tiger Style coding principles"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin to fix-nightly commit until dylint publishes a release with the
# env_depinfo/file_depinfo removal fix (PR #1942).
dylint_linting = { git = "https://github.com/trailofbits/dylint", rev = "0e0a71eefe6f01563d11acc6e1d7af1d505934a9" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
toml = "1"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]

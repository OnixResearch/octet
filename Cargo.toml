[package]
name = "tigerstyle"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Custom lints enforcing Tiger Style coding principles"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin to fix-nightly branch until dylint publishes a release with the
# env_depinfo/file_depinfo removal fix (PR #1942).
dylint_linting = { git = "https://github.com/trailofbits/dylint", branch = "fix-nightly" }

[dev-dependencies]
dylint_testing = { git = "https://github.com/trailofbits/dylint", branch = "fix-nightly" }

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
